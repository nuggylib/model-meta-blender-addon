[project]
name = "model-meta-bridge"
version = "0.0.1"
requires-python = "==3.11.*"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "bpy~=4.2.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
extend-select = [
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "PL",  # pylint
]
ignore = [
    "PLR2004",  # magic-value-comparison
]
