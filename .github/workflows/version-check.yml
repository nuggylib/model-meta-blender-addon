name: Version check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-bumped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check the manifest version is new
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Skipped in-job, not via `paths:`: a path-filtered required check stays pending forever.
          if [ -z "$(git diff --name-only "origin/$BASE_REF...HEAD" -- src ':!src/*.md')" ]; then
            echo "No functional changes under src/; no version bump needed."
            exit 0
          fi
          manifest_version() {
            sed -n 's/^version = "\(.*\)"$/\1/p'
          }
          base=$(git show "origin/$BASE_REF:src/blender_manifest.toml" | manifest_version)
          head=$(manifest_version < src/blender_manifest.toml)
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "::error::no version in src/blender_manifest.toml (base: '$base', PR: '$head')"
            exit 1
          fi
          highest=$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -n 1)
          if [ "$head" = "$base" ] || [ "$highest" != "$head" ]; then
            echo "::error file=src/blender_manifest.toml::version $head must be higher than $base on $BASE_REF"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$head" >/dev/null; then
            echo "::error file=src/blender_manifest.toml::v$head is already tagged; pick a higher version"
            exit 1
          fi
          echo "Version $head is higher than $base on $BASE_REF"
